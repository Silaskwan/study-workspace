<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --paper: #F2F1E9;
  --paper-raised: #FBFAF5;
  --ink: #1C2B3A;
  --ink-soft: #4B5A68;
  --line: #D9D4C4;
  --line-strong: #C3BCA6;
  --navy: #2B4C7E;
  --navy-deep: #1E3A63;
  --shadow: 0 1px 2px rgba(28,43,58,0.06), 0 6px 18px rgba(28,43,58,0.08);
  --shadow-lift: 0 4px 10px rgba(28,43,58,0.10), 0 14px 32px rgba(28,43,58,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Fraunces', serif;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 8% -5%, rgba(43,76,126,0.06), transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}

a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--navy); outline-offset:2px; border-radius:6px;}

.wrap{max-width:1080px; margin:0 auto; padding:0 24px 80px;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(242,241,233,0.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1080px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{
  font-family:var(--font-display); font-weight:700; font-size:1.15rem;
  letter-spacing:0.01em; display:flex; align-items:center; gap:8px;
  text-decoration:none; color:var(--ink); white-space:nowrap;
}
.brand-mark{
  width:28px; height:28px; border-radius:7px; background:var(--navy);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:0.85rem; font-family:var(--font-mono); font-weight:600;
  transform:rotate(-4deg);
}
.nav-actions{display:flex; gap:8px; margin-left:auto;}
.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--paper-raised); border:1px solid var(--line-strong);
  color:var(--ink); padding:8px 14px; border-radius:999px;
  font-size:0.85rem; font-weight:500; cursor:pointer;
  transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.icon-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow); background:#fff;}
.icon-btn:active{transform:translateY(0);}

.crumbs{
  max-width:1080px; margin:0 auto; padding:14px 24px 0;
  font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-soft);
  display:flex; align-items:center; flex-wrap:wrap; gap:6px;
}
.crumbs a{text-decoration:none; color:var(--ink-soft); padding:2px 4px; border-radius:4px;}
.crumbs a:hover{color:var(--navy); background:rgba(43,76,126,0.08);}
.crumbs .sep{color:var(--line-strong);}
.crumbs .current{color:var(--ink); font-weight:600;}

/* ---------- Headings ---------- */
.eyebrow{
  font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px;
}
h1.page-title{
  font-family:var(--font-display); font-weight:600; font-size:clamp(1.8rem,4vw,2.6rem);
  margin:0 0 6px; line-height:1.1;
}
.page-sub{color:var(--ink-soft); font-size:1rem; margin:0 0 28px; max-width:60ch;}

.section-head{margin:40px 0 18px; display:flex; align-items:baseline; gap:10px;}
.section-head h2{font-family:var(--font-display); font-size:1.3rem; font-weight:600; margin:0;}

/* ---------- Home grid ---------- */
.home-hero{padding:56px 0 12px;}
.home-hero h1{
  font-family:var(--font-display); font-weight:600; font-size:clamp(2.2rem,5vw,3.4rem);
  margin:0 0 10px; line-height:1.06; max-width:16ch;
}
.home-hero p{color:var(--ink-soft); font-size:1.05rem; max-width:52ch; margin:0 0 8px;}
.home-stamp{
  font-family:var(--font-mono); font-size:0.75rem; color:var(--ink-soft);
  display:inline-flex; align-items:center; gap:8px; margin-top:18px;
  border:1px dashed var(--line-strong); padding:6px 12px; border-radius:999px;
}

.subject-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; margin-top:32px;
}
@media (max-width:900px){.subject-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.subject-grid{grid-template-columns:1fr;}}

.tab-card{
  position:relative; display:block; text-decoration:none; color:var(--ink);
  background:var(--paper-raised); border:1px solid var(--line);
  border-radius:var(--radius); padding:26px 20px 20px;
  box-shadow:var(--shadow); overflow:hidden;
  transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  cursor:pointer;
}
.tab-card::before{
  content:""; position:absolute; top:0; left:22px; width:46px; height:10px;
  background:var(--tab-color, var(--navy)); border-radius:0 0 6px 6px;
}
.tab-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:var(--tab-color, var(--navy));}
.tab-card .glyph{
  width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--tab-color, var(--navy)) 14%, white);
  color:var(--tab-color, var(--navy)); font-size:1.3rem; font-weight:600;
  margin-bottom:16px; font-family:var(--font-display);
}
.tab-card h3{font-family:var(--font-display); font-size:1.25rem; font-weight:600; margin:0 0 4px;}
.tab-card .count{font-family:var(--font-mono); font-size:0.76rem; color:var(--ink-soft);}
.tab-card .arrow{
  position:absolute; right:18px; bottom:18px; font-size:1.1rem; color:var(--tab-color, var(--navy));
  opacity:0; transform:translateX(-4px); transition:all 0.18s ease;
}
.tab-card:hover .arrow{opacity:1; transform:translateX(0);}

/* ---------- Chapter / node list ---------- */
.node-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.node-row{
  display:flex; align-items:center; gap:16px;
  background:var(--paper-raised); border:1px solid var(--line);
  border-left:5px solid var(--tab-color, var(--navy));
  border-radius:var(--radius-sm); padding:16px 18px;
  text-decoration:none; color:var(--ink);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
  cursor:pointer;
}
.node-row:hover{transform:translateX(4px); box-shadow:var(--shadow);}
.node-num{
  font-family:var(--font-mono); font-size:0.85rem; color:var(--tab-color, var(--navy));
  font-weight:600; min-width:44px;
}
.node-row .node-body{flex:1;}
.node-row h3{margin:0; font-size:1.02rem; font-weight:600; font-family:var(--font-body);}
.node-row .node-meta{font-size:0.78rem; color:var(--ink-soft); font-family:var(--font-mono); margin-top:2px;}
.node-row .chev{color:var(--line-strong); font-size:1.2rem;}
.node-row.is-group h3::after{
  content:"GROUP"; font-family:var(--font-mono); font-size:0.6rem; color:var(--ink-soft);
  border:1px solid var(--line-strong); border-radius:4px; padding:1px 5px; margin-left:8px; vertical-align:middle; letter-spacing:0.05em;
}

.empty-state{
  border:1.5px dashed var(--line-strong); border-radius:var(--radius);
  padding:40px 24px; text-align:center; color:var(--ink-soft); margin-top:12px;
}
.empty-state .big{font-family:var(--font-display); font-size:1.3rem; color:var(--ink); margin-bottom:6px;}
.empty-state code{font-family:var(--font-mono); background:#fff; padding:2px 6px; border-radius:5px; border:1px solid var(--line);}

/* ---------- Chapter learning page ---------- */
.chapter-shell{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:36px 36px 30px; margin-top:8px; position:relative;
}
.chapter-shell::before{
  content:""; position:absolute; top:0; left:32px; width:50px; height:10px;
  background:var(--tab-color, var(--navy)); border-radius:0 0 6px 6px;
}
@media (max-width:600px){.chapter-shell{padding:26px 20px 22px;}}

.content-body{font-size:1.02rem; line-height:1.75; color:var(--ink);}
.content-body p{margin:0 0 1em;}
.content-placeholder{
  border:1.5px dashed var(--line-strong); border-radius:var(--radius-sm);
  padding:26px 20px; color:var(--ink-soft); font-size:0.95rem; margin-bottom:8px;
}

.action-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; padding-top:24px; border-top:1px solid var(--line);}
.btn{
  font-family:var(--font-body); font-weight:600; font-size:0.92rem;
  padding:12px 22px; border-radius:999px; border:none; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px;
  transition:transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}
.btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--tab-color, var(--navy)); color:#fff;}
.btn-secondary{background:#fff; color:var(--ink); border:1.5px solid var(--line-strong);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px dashed var(--line-strong);}
.btn:disabled{opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none;}

/* ---------- Quiz ---------- */
.quiz-progress{
  display:flex; align-items:center; gap:12px; margin-bottom:26px; font-family:var(--font-mono); font-size:0.8rem; color:var(--ink-soft);
}
.quiz-progress .bar{flex:1; height:6px; background:var(--line); border-radius:99px; overflow:hidden;}
.quiz-progress .fill{height:100%; background:var(--tab-color, var(--navy)); border-radius:99px; transition:width 0.25s ease;}
.quiz-q{font-family:var(--font-display); font-size:1.35rem; font-weight:600; margin:0 0 22px; line-height:1.35;}
.quiz-options{display:flex; flex-direction:column; gap:10px;}
.quiz-opt{
  text-align:left; background:#fff; border:1.5px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:14px 16px; font-size:0.98rem; cursor:pointer; display:flex; align-items:center; gap:12px;
  transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.quiz-opt:hover{border-color:var(--tab-color, var(--navy));}
.quiz-opt .letter{
  width:26px; height:26px; border-radius:7px; background:var(--paper); border:1px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.75rem; font-weight:600; flex-shrink:0;
}
.quiz-opt.selected{border-color:var(--tab-color, var(--navy)); background:color-mix(in srgb, var(--tab-color, var(--navy)) 8%, white);}
.quiz-opt.correct{border-color:#2F9E6E; background:rgba(47,158,110,0.1);}
.quiz-opt.incorrect{border-color:#D6455C; background:rgba(214,69,92,0.08);}
.quiz-opt:disabled{cursor:default;}
.quiz-text-input{
  width:100%; padding:14px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--line-strong);
  font-size:1rem; font-family:var(--font-body); background:#fff;
}
.quiz-text-input:focus{border-color:var(--tab-color, var(--navy));}
.quiz-feedback{margin-top:14px; font-size:0.88rem; font-weight:600;}
.quiz-feedback.ok{color:#1F7A50;}
.quiz-feedback.no{color:#B7273E;}

.quiz-nav{display:flex; justify-content:space-between; margin-top:28px;}

.quiz-results{text-align:center; padding:20px 0;}
.quiz-score{font-family:var(--font-display); font-size:3rem; font-weight:700; margin:6px 0;}
.quiz-score-label{font-family:var(--font-mono); font-size:0.8rem; color:var(--ink-soft); letter-spacing:0.08em; text-transform:uppercase;}
.quiz-review{text-align:left; margin-top:32px; display:flex; flex-direction:column; gap:10px;}
.review-row{
  border:1px solid var(--line); border-left:5px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:14px 16px; background:#fff; font-size:0.9rem;
}
.review-row.ok{border-left-color:#2F9E6E;}
.review-row.no{border-left-color:#D6455C;}
.review-row .rq{font-weight:600; margin-bottom:4px;}
.review-row .ra{color:var(--ink-soft); font-size:0.85rem;}

/* ---------- Flashcards ---------- */
.fc-toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:22px;}
.fc-counter{font-family:var(--font-mono); font-size:0.85rem; color:var(--ink-soft); background:#fff; border:1px solid var(--line-strong); padding:6px 14px; border-radius:999px;}

.fc-settings{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px; margin-bottom:24px;
  display:grid; grid-template-columns:1fr 1fr; gap:20px;
}
@media (max-width:560px){.fc-settings{grid-template-columns:1fr;}}
.fc-settings .side-group label.title{
  font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); display:block; margin-bottom:8px;
}
.seg{display:flex; gap:6px; flex-wrap:wrap;}
.seg button{
  background:var(--paper); border:1.5px solid var(--line-strong); border-radius:999px; padding:6px 13px;
  font-size:0.8rem; cursor:pointer; color:var(--ink-soft); font-weight:500;
}
.seg button.active{background:var(--tab-color, var(--navy)); color:#fff; border-color:var(--tab-color, var(--navy));}

.fc-stage{display:flex; justify-content:center; margin:10px 0 26px;}
.flashcard{
  width:100%; max-width:440px; height:270px; perspective:1400px; cursor:pointer;
}
.flashcard-inner{
  position:relative; width:100%; height:100%; text-align:center;
  transition:transform 0.5s cubic-bezier(.2,.9,.25,1); transform-style:preserve-3d;
}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
  border:1.5px solid var(--line-strong); box-shadow:var(--shadow-lift); padding:24px; background:#fff;
}
.flashcard-face .cjk{font-family:'Noto Sans JP','Noto Sans SC',sans-serif; font-size:2.6rem; font-weight:700;}
.flashcard-face .plain{font-family:var(--font-display); font-size:1.9rem; font-weight:600;}
.flashcard-face .side-label{
  position:absolute; top:14px; left:16px; font-family:var(--font-mono); font-size:0.65rem; letter-spacing:0.1em;
  color:var(--ink-soft); text-transform:uppercase;
}
.flashcard-back{transform:rotateY(180deg); background:color-mix(in srgb, var(--tab-color, var(--navy)) 6%, white);}
.flashcard-hint{text-align:center; font-size:0.78rem; color:var(--ink-soft); font-family:var(--font-mono); margin-top:-14px; margin-bottom:20px;}

.fc-controls{display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap;}
.fc-icon-btn{
  width:46px; height:46px; border-radius:50%; border:1.5px solid var(--line-strong); background:#fff;
  font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink);
}
.fc-icon-btn:hover{border-color:var(--tab-color, var(--navy)); color:var(--tab-color, var(--navy));}
.fc-empty-note{font-size:0.78rem; color:var(--ink-soft); text-align:center; margin-top:6px; font-family:var(--font-mono);}

/* ---------- misc ---------- */
.divider-note{
  font-family:var(--font-mono); font-size:0.75rem; color:var(--ink-soft);
  border-top:1px dashed var(--line-strong); margin-top:44px; padding-top:16px;
}
.pill{
  display:inline-block; font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.06em;
  background:color-mix(in srgb, var(--tab-color, var(--navy)) 12%, white); color:var(--tab-color, var(--navy));
  padding:3px 9px; border-radius:999px; margin-right:6px; text-transform:uppercase;
}
.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="#/" class="brand"><span class="brand-mark">SD</span>Study Desk</a>
    <div class="nav-actions">
      <button class="icon-btn" onclick="history.back()">&larr; Back</button>
      <button class="icon-btn" onclick="location.hash='#/'">&#8962; Home</button>
    </div>
  </div>
</div>
<div id="crumbs" class="crumbs"></div>

<main class="wrap">
  <div id="app"></div>
</main>

<script>
/* ================================================================
   STUDY DESK — DATA MODEL
   ----------------------------------------------------------------
   Everything you'll want to edit later (chapters, lesson content,
   quiz questions, flashcard vocab) lives in the DATA object below.
   The rest of the file is generic rendering / routing code that
   reads this structure — you should not need to touch it to add
   content.

   NODE SHAPES
   -----------
   A "leaf" node is an actual lesson page:
     {
       id: 'ch1',            // used in the URL, must be unique among siblings
       title: 'Chapter 1',   // shown to the user
       type: 'leaf',
       content: `<p>HTML lesson content goes here.</p>`,
       quiz: [ ... ],        // see QUIZ QUESTION SHAPES below, [] = no quiz yet
       flashcards: [ ... ]   // only for Japanese / Chinese, see below, null/[] = none yet
     }

   A "group" node just holds child nodes (used for Chinese units,
   which contain 5 sub-chapters each). Groups can be nested if needed.
     {
       id: 'unit1',
       title: '\u5355\u5143\u4e00',
       type: 'group',
       children: [ ...leaf or group nodes... ]
     }

   QUIZ QUESTION SHAPES
   ---------------------
   Multiple choice:
     { type:'mc', q:'2 + 2 = ?', options:['3','4','5','6'], answer:1 }
   Short answer (case-insensitive, trims whitespace):
     { type:'text', q:'Capital of Japan?', answer:'Tokyo' }

   FLASHCARD SHAPES
   -----------------
   Japanese: { furigana:'\u3042\u308a\u304c\u3068\u3046', kanji:'\u6709\u308a\u96e3\u3046', english:'thank you' }
   Chinese:  { pinyin:'x\u00e8xie', hanzi:'\u8c22\u8c22', english:'thank you' }
   ================================================================ */

function chapters(from, to){
  const arr = [];
  for(let i = from; i <= to; i++){
    arr.push({ id:'ch'+i, title:'Chapter '+i, type:'leaf', content:'', quiz:[], flashcards:null });
  }
  return arr;
}

function chineseUnits(){
  const names = ['\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d']; // 一 二 三 四 五 六
  const subParts = [
    {id:'shenghuo',  title:'\u751f\u6d3b\u7a7a\u95f4'}, // 生活空间
    {id:'xinhe',     title:'\u5fc3\u6838'},             // 心核
    {id:'gonggu',    title:'\u5de9\u56fa'},             // 巩固
    {id:'jinjie',    title:'\u8fdb\u9636'},             // 进阶
    {id:'qitazi',    title:'\u5176\u4ed6\u5b57'}        // 其他字
  ];
  return names.map((cn, idx) => ({
    id: 'unit' + (idx+1),
    title: '\u5355\u5143' + cn, // 单元 + number
    type: 'group',
    children: subParts.map(p => ({
      id: p.id, title: p.title, type:'leaf', content:'', quiz:[], flashcards: []
    }))
  }));
}

const DATA = {
  math: {
    name:'Math', short:'MTH', icon:'\u2211', color:'#3B6FD6',
    chapters: chapters(1, 11)
  },
  science: {
    name:'Science', short:'SCI', icon:'\u2697', color:'#2F9E6E',
    chapters: chapters(1, 5)
  },
  japanese: {
    name:'Japanese', short:'JPN', icon:'\u3042', color:'#E0556F',
    hasFlashcards:true,
    flashcardFields:{ furigana:'Furigana', kanji:'Kanji', english:'English Meaning' },
    chapters: chapters(0, 11)
  },
  chinese: {
    name:'Chinese', short:'CHN', icon:'\u4e2d', color:'#C8462B',
    hasFlashcards:true,
    flashcardFields:{ pinyin:'Hanyu Pinyin', hanzi:'Hanzi', english:'English Meaning' },
    chapters: chineseUnits()
  },
  english: { name:'English', short:'ENG', icon:'Ab', color:'#7B5FBE', chapters: [] },
  literature: { name:'Literature', short:'LIT', icon:'\u2766', color:'#9C6B3F', chapters: [] },
  history: {
    name:'History', short:'HIS', icon:'\ud83c\udfdb', color:'#B08A3E',
    chapters: chapters(1, 5)
  },
  geography: { name:'Geography', short:'GEO', icon:'\ud83c\udf10', color:'#1F8A8C', chapters: [] }
};

/* ================================================================
   ROUTER + RENDERING (generic — shouldn't need edits)
   ================================================================ */

const app = document.getElementById('app');
const crumbsEl = document.getElementById('crumbs');
let fcState = {}; // in-memory flashcard runtime state, keyed by node path

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setTabColor(hex){
  document.documentElement.style.setProperty('--tab-color', hex || 'var(--navy)');
}

function parseHash(){
  const raw = location.hash.replace(/^#\/?/, '');
  const segs = raw.split('/').filter(Boolean);
  return segs;
}

function findNode(subject, ids){
  let list = subject.chapters;
  let node = null;
  for(const id of ids){
    node = (list || []).find(n => n.id === id);
    if(!node) return null;
    list = node.children;
  }
  return node;
}

function pathTitles(subject, ids){
  const titles = [];
  let list = subject.chapters;
  for(const id of ids){
    const node = (list || []).find(n => n.id === id);
    if(!node) break;
    titles.push(node);
    list = node.children;
  }
  return titles;
}

function render(){
  const segs = parseHash();
  window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant' : 'auto'});

  if(segs[0] !== 's'){
    setTabColor(null);
    renderCrumbs([]);
    renderHome();
    return;
  }

  const subjectId = segs[1];
  const subject = DATA[subjectId];
  if(!subject){ renderHome(); return; }
  setTabColor(subject.color);

  let rest = segs.slice(2);
  let action = null;
  if(rest.length && (rest[rest.length-1] === 'quiz' || rest[rest.length-1] === 'flashcards')){
    action = rest[rest.length-1];
    rest = rest.slice(0, -1);
  }

  const trail = pathTitles(subject, rest);
  const node = rest.length ? (trail.length === rest.length ? trail[trail.length-1] : null) : null;

  renderCrumbs(buildCrumbs(subjectId, subject, trail, action));

  if(rest.length && !node){
    renderNotFound();
    return;
  }

  if(!rest.length){
    renderChapterList(subjectId, subject, subject.chapters, subject.name, []);
    return;
  }

  if(node.type === 'group'){
    renderChapterList(subjectId, subject, node.children, node.title, rest);
    return;
  }

  // leaf node
  if(action === 'quiz'){
    renderQuiz(subjectId, subject, node, rest);
  } else if(action === 'flashcards'){
    renderFlashcards(subjectId, subject, node, rest);
  } else {
    renderChapterPage(subjectId, subject, node, rest);
  }
}

function buildCrumbs(subjectId, subject, trail, action){
  const items = [{label:'Home', href:'#/'}];
  items.push({label: subject.name, href:'#/s/'+subjectId});
  let acc = '#/s/' + subjectId;
  trail.forEach(node => {
    acc += '/' + node.id;
    items.push({label: node.title, href: acc});
  });
  if(action === 'quiz') items.push({label:'Quiz'});
  if(action === 'flashcards') items.push({label:'Flashcards'});
  return items;
}

function renderCrumbs(items){
  if(!items.length){ crumbsEl.innerHTML=''; return; }
  crumbsEl.innerHTML = items.map((it, i) => {
    const isLast = i === items.length - 1;
    const sep = i > 0 ? '<span class="sep">/</span>' : '';
    if(isLast || !it.href){
      return sep + '<span class="current">' + esc(it.label) + '</span>';
    }
    return sep + '<a href="' + it.href + '">' + esc(it.label) + '</a>';
  }).join('');
}

function subjectCount(subject){

  if(!n) return 'No chapters yet';
  const isGroup = subject.chapters[0].type === 'group';
  return n + (isGroup ? ' unit' : ' chapter') + (n === 1 ? '' : 's');
}

/* ---------------- CHAPTER LIST (subject root or group) ---------------- */

function renderChapterList(subjectId, subject, list, heading, pathIds){
  const base = '#/s/' + subjectId + (pathIds.length ? '/' + pathIds.join('/') : '');
  const rows = (list || []).map((node, i) => {
    const href = base + '/' + node.id;
    const num = String(i+1).padStart(2,'0');
    const meta = node.type === 'group'
      ? (node.children.length) + ' sub-section' + (node.children.length===1?'':'s')
      : (node.quiz && node.quiz.length ? node.quiz.length + ' quiz question' + (node.quiz.length===1?'':'s') : 'No quiz yet');
    return `
      <a class="node-row ${node.type==='group'?'is-group':''}" style="--tab-color:${subject.color}" href="${href}">
        <div class="node-num">${num}</div>
        <div class="node-body">
          <h3>${esc(node.title)}</h3>
          <div class="node-meta">${esc(meta)}</div>
        </div>
        <div class="chev">&rarr;</div>
      </a>`;
  }).join('');

  app.innerHTML = `
    <div class="fade-in">
      <p class="eyebrow">${esc(subject.name)}</p>
      <h1 class="page-title">${esc(heading)}</h1>
      <p class="page-sub">${(list && list.length) ? 'Choose where to pick up.' : 'Nothing added yet for this section.'}</p>
      ${
        (list && list.length)
        ? `<div class="node-list">${rows}</div>`
        : `<div class="empty-state">
             <div class="big">No chapters yet</div>
             <p>Add entries to <code>DATA.${subjectId}.chapters</code> in the script to populate this page.</p>
           </div>`
      }
    </div>
  `;
}

/* ---------------- QUIZ ---------------- */

function renderQuiz(subjectId, subject, node, pathIds){
  const backHref = '#/s/' + subjectId + '/' + pathIds.join('/');
  const questions = node.quiz || [];

  if(!questions.length){
    app.innerHTML = `
      <div class="fade-in">
        <p class="eyebrow">${esc(subject.name)} &middot; Quiz</p>
        <h1 class="page-title">${esc(node.title)}</h1>
      </div>
      <div class="empty-state fade-in">
        <div class="big">No quiz questions yet</div>
        <p>Add entries to this chapter's <code>quiz</code> array in the DATA object.</p>
        <div class="action-row" style="justify-content:center; border:none; padding-top:20px;">
          <button class="btn btn-secondary" onclick="location.hash='${backHref}'">&larr; Back to chapter</button>
        </div>
      </div>`;
    return;
  }

  const state = { i:0, answers:new Array(questions.length).fill(null), locked:new Array(questions.length).fill(false) };

  function paintQuestion(){
    const q = questions[state.i];
    const pct = Math.round(((state.i) / questions.length) * 100);
    let bodyHtml = '';

    if(q.type === 'text'){
      const val = state.answers[state.i] || '';
      const locked = state.locked[state.i];
      bodyHtml = `
        <input type="text" class="quiz-text-input" id="qtext" placeholder="Type your answer&hellip;"
          value="${esc(val)}" ${locked ? 'disabled' : ''} autocomplete="off">
        ${locked ? feedbackHtml(state.i, q) : ''}
      `;
    } else {
      const locked = state.locked[state.i];
      bodyHtml = `
        <div class="quiz-options">
          ${q.options.map((opt, oi) => {
            let cls = 'quiz-opt';
            if(locked){
              if(oi === q.answer) cls += ' correct';
              else if(oi === state.answers[state.i]) cls += ' incorrect';
            } else if(state.answers[state.i] === oi){
              cls += ' selected';
            }
            return `<button class="${cls}" ${locked?'disabled':''} onclick="window.__quizPick(${oi})">
              <span class="letter">${String.fromCharCode(65+oi)}</span>${esc(opt)}
            </button>`;
          }).join('')}
        </div>
        ${locked ? feedbackHtml(state.i, q) : ''}
      `;
    }

    document.getElementById('quiz-body').innerHTML = bodyHtml;
    document.getElementById('quiz-fill').style.width = pct + '%';
    document.getElementById('quiz-progress-label').textContent = 'Question ' + (state.i+1) + ' of ' + questions.length;
    document.getElementById('quiz-q-text').textContent = q.q;

    const locked = state.locked[state.i];
    const submitBtn = document.getElementById('quiz-submit');
    const nextBtn = document.getElementById('quiz-next');
    submitBtn.style.display = locked ? 'none' : 'inline-flex';
    nextBtn.style.display = locked ? 'inline-flex' : 'none';
    nextBtn.textContent = (state.i === questions.length - 1) ? 'See results \u2192' : 'Next \u2192';
    document.getElementById('quiz-prev').disabled = state.i === 0;

    if(q.type === 'text' && !locked){
      const inp = document.getElementById('qtext');
      inp.addEventListener('input', e => { state.answers[state.i] = e.target.value; });
      inp.focus();
    }
  }

  function feedbackHtml(i, q){
    const correct = isCorrect(i, q);
    return `<div class="quiz-feedback ${correct?'ok':'no'}">${correct ? '\u2713 Correct!' : '\u2717 Not quite &mdash; correct answer: ' + esc(correctAnswerLabel(q))}</div>`;
  }

  function correctAnswerLabel(q){
    return q.type === 'text' ? q.answer : q.options[q.answer];
  }

  function isCorrect(i, q){
    if(q.type === 'text'){
      const val = (state.answers[i] || '').trim().toLowerCase();
      return val === String(q.answer).trim().toLowerCase();
    }
    return state.answers[i] === q.answer;
  }

  window.__quizPick = function(oi){
    if(state.locked[state.i]) return;
    state.answers[state.i] = oi;
    paintQuestion();
  };

  window.__quizSubmit = function(){
    const q = questions[state.i];
    if(q.type === 'text'){
      const inp = document.getElementById('qtext');
      state.answers[state.i] = inp ? inp.value : state.answers[state.i];
      if(!state.answers[state.i]) return;
    } else if(state.answers[state.i] === null){
      return;
    }
    state.locked[state.i] = true;
    paintQuestion();
  };

  window.__quizNext = function(){
    if(state.i < questions.length - 1){
      state.i++;
      paintQuestion();
    } else {
      showResults();
    }
  };

  window.__quizPrev = function(){
    if(state.i > 0){ state.i--; paintQuestion(); }
  };

  window.__quizRetry = function(){
    renderQuiz(subjectId, subject, node, pathIds);
  };

  function showResults(){
    let correctCount = 0;
    const reviewRows = questions.map((q, i) => {
      const ok = state.locked[i] ? isCorrect(i, q) : false;
      if(ok) correctCount++;
      const yourAns = q.type === 'text'
        ? (state.answers[i] || '(no answer)')
        : (state.answers[i] !== null ? q.options[state.answers[i]] : '(no answer)');
      return `
        <div class="review-row ${ok ? 'ok':'no'}">
          <div class="rq">${ok ? '\u2713' : '\u2717'} ${esc(q.q)}</div>
          <div class="ra">Your answer: ${esc(yourAns)}${ok ? '' : ' &mdash; correct: ' + esc(correctAnswerLabel(q))}</div>
        </div>`;
    }).join('');

    const pct = Math.round((correctCount / questions.length) * 100);

    app.innerHTML = `
      <div class="fade-in">
        <p class="eyebrow">${esc(subject.name)} &middot; Quiz results</p>
        <h1 class="page-title">${esc(node.title)}</h1>
      </div>
      <div class="chapter-shell fade-in" style="--tab-color:${subject.color}">
        <div class="quiz-results">
          <div class="quiz-score-label">Your score</div>
          <div class="quiz-score">${correctCount}/${questions.length}</div>
          <div class="quiz-score-label">${pct}% correct</div>
        </div>
        <div class="quiz-review">${reviewRows}</div>
        <div class="action-row" style="justify-content:center;">
          <button class="btn btn-primary" onclick="window.__quizRetry()">&#8635; Retry quiz</button>
          <button class="btn btn-secondary" onclick="location.hash='${backHref}'">&larr; Back to chapter</button>
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="fade-in">
      <p class="eyebrow">${esc(subject.name)} &middot; Quiz</p>
      <h1 class="page-title">${esc(node.title)}</h1>
    </div>
    <div class="chapter-shell fade-in" style="--tab-color:${subject.color}">
      <div class="quiz-progress">
        <span id="quiz-progress-label"></span>
        <div class="bar"><div class="fill" id="quiz-fill"></div></div>
      </div>
      <h2 class="quiz-q" id="quiz-q-text"></h2>
      <div id="quiz-body"></div>
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="quiz-prev" onclick="window.__quizPrev()">&larr; Previous</button>
        <div>
          <button class="btn btn-primary" id="quiz-submit" onclick="window.__quizSubmit()">Check answer</button>
          <button class="btn btn-primary" id="quiz-next" style="display:none" onclick="window.__quizNext()">Next &rarr;</button>
        </div>
      </div>
    </div>
  `;
  paintQuestion();
}

/* ---------------- FLASHCARDS ---------------- */

async function loadFcSettings(subjectId, defaults){
  try{
    if(window.storage){
      const res = await window.storage.get('fc-settings:' + subjectId);
      if(res && res.value) return JSON.parse(res.value);
    }
  }catch(e){ /* no saved settings yet, fall through to defaults */ }
  return defaults;
}

async function saveFcSettings(subjectId, settings){
  try{
    if(window.storage){
      await window.storage.set('fc-settings:' + subjectId, JSON.stringify(settings));
    }
  }catch(e){ /* storage unavailable — settings just won't persist across sessions */ }
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

async function renderFlashcards(subjectId, subject, node, pathIds){
  const backHref = '#/s/' + subjectId + '/' + pathIds.join('/');
  const cards = node.flashcards || [];
  const fields = subject.flashcardFields || {};
  const fieldKeys = Object.keys(fields);
  const isCjk = fieldKeys.includes('kanji') || fieldKeys.includes('hanzi');
  const cjkKey = fieldKeys.includes('kanji') ? 'kanji' : (fieldKeys.includes('hanzi') ? 'hanzi' : null);

  const defaults = { side1: fieldKeys[1] || fieldKeys[0], side2: fieldKeys[2] || fieldKeys[0] };
  const settings = await loadFcSettings(subjectId, defaults);

  const st = {
    order: cards.map((_, i) => i),
    i: 0,
    flipped: false,
    side1: settings.side1,
    side2: settings.side2
  };

  if(!cards.length){
    app.innerHTML = `
      <div class="fade-in">
        <p class="eyebrow">${esc(subject.name)} &middot; Flashcards</p>
        <h1 class="page-title">${esc(node.title)}</h1>
      </div>
      <div class="empty-state fade-in">
        <div class="big">No flashcards yet</div>
        <p>Add vocab objects to this chapter's <code>flashcards</code> array in the DATA object.</p>
        <div class="action-row" style="justify-content:center; border:none; padding-top:20px;">
          <button class="btn btn-secondary" onclick="location.hash='${backHref}'">&larr; Back to chapter</button>
        </div>
      </div>`;
    return;
  }

  function seg(name, current){
    return fieldKeys.map(k => `<button class="${k===current?'active':''}" onclick="window.__fcSetSide('${name}','${k}')">${esc(fields[k])}</button>`).join('');
  }

  function faceInnerHtml(cardIdx, fieldKey, sideNum){
    const card = cards[cardIdx];
    const val = card[fieldKey] != null ? card[fieldKey] : '\u2014';
    const useCjk = isCjk && (fieldKey === cjkKey);
    return `
        <span class="side-label">Side ${sideNum} &middot; ${esc(fields[fieldKey] || fieldKey)}</span>
        <span class="${useCjk ? 'cjk' : 'plain'}">${esc(val)}</span>`;
  }

  function paint(){
    const realIdx = st.order[st.i];
    document.getElementById('fc-card').className = 'flashcard' + (st.flipped ? ' flipped' : '');
    document.getElementById('fc-face1').innerHTML = faceInnerHtml(realIdx, st.side1, 1);
    document.getElementById('fc-face2').innerHTML = faceInnerHtml(realIdx, st.side2, 2);
    document.getElementById('fc-counter').textContent = (st.i+1) + ' / ' + cards.length;
    document.getElementById('fc-side1-seg').innerHTML = seg('side1', st.side1);
    document.getElementById('fc-side2-seg').innerHTML = seg('side2', st.side2);
  }

  window.__fcFlip = function(){ st.flipped = !st.flipped; paint(); };
  window.__fcNext = function(){ st.i = (st.i + 1) % cards.length; st.flipped = false; paint(); };
  window.__fcPrev = function(){ st.i = (st.i - 1 + cards.length) % cards.length; st.flipped = false; paint(); };
  window.__fcShuffle = function(){ st.order = shuffleArray(st.order); st.i = 0; st.flipped = false; paint(); };
  window.__fcReset = function(){ st.order = cards.map((_,i)=>i); st.i = 0; st.flipped = false; paint(); };
  window.__fcSetSide = function(which, key){
    st[which] = key;
    st.flipped = false;
    saveFcSettings(subjectId, { side1: st.side1, side2: st.side2 });
    paint();
  };

  app.innerHTML = `
    <div class="fade-in">
      <p class="eyebrow">${esc(subject.name)} &middot; Flashcards</p>
      <h1 class="page-title">${esc(node.title)}</h1>
    </div>
    <div class="chapter-shell fade-in" style="--tab-color:${subject.color}">
      <div class="fc-settings">
        <div class="side-group">
          <label class="title">Side 1 shows</label>
          <div class="seg" id="fc-side1-seg"></div>
        </div>
        <div class="side-group">
          <label class="title">Side 2 shows</label>
          <div class="seg" id="fc-side2-seg"></div>
        </div>
      </div>

      <div class="fc-toolbar">
        <span class="fc-counter" id="fc-counter"></span>
        <button class="btn btn-secondary" onclick="location.hash='${backHref}'">&larr; Back to chapter</button>
      </div>

      <div class="fc-stage">
        <div class="flashcard" id="fc-card" onclick="window.__fcFlip()">
          <div class="flashcard-inner">
            <div class="flashcard-face" id="fc-face1"></div>
            <div class="flashcard-face flashcard-back" id="fc-face2"></div>
          </div>
        </div>
      </div>
      <div class="flashcard-hint">Tap the card to flip</div>

      <div class="fc-controls">
        <button class="fc-icon-btn" title="Previous" onclick="window.__fcPrev()">&larr;</button>
        <button class="fc-icon-btn" title="Shuffle" onclick="window.__fcShuffle()">&#128256;</button>
        <button class="fc-icon-btn" title="Restart" onclick="window.__fcReset()">&#8635;</button>
        <button class="fc-icon-btn" title="Next" onclick="window.__fcNext()">&rarr;</button>
      </div>
    </div>
  `;
  paint();
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
